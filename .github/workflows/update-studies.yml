name: Studien-Update (täglich)

# 03:00 UTC = 05:00 Uhr Berlin (Sommerzeit) bzw. 04:00 Uhr (Winterzeit).
# GitHub führt geplante Läufe bei hoher Last mit einigen Minuten Verzögerung aus
# - am 24.08.2026 waren es fast zwei Stunden. Deshalb am selben Tag um eine
# Stunde vorgezogen: Der Sammelbericht (03:45 UTC, Repo knowledge-hubs) muss
# nach diesem Lauf kommen, und beide deutlich vor dem Versand um 10:00 Ortszeit.
on:
  schedule:
    - cron: "0 3 * * *"
    # Netz fuer einen ausgefallenen ersten Lauf: Am 27.08.2026 hat GitHub die
    # geplanten Laeufe aller dreizehn Repos verschluckt (zeitgleich mit einer
    # Stoerung der Billing-Dienste), und es kam kein einziger Newsletter.
    # 05:30 UTC liegt gut vier Stunden vor dem Versand um 10:00 Ortszeit. An
    # normalen Tagen kostet dieser Lauf nichts: update_studies.py bricht sofort
    # ab, wenn das Archiv fuer heute schon Studien hat.
    - cron: "30 5 * * *"
  workflow_dispatch:        # erlaubt manuelles Starten über die Actions-Oberfläche
    inputs:
      nur_studien:
        description: "Nur Studien holen, keine Kampagne anlegen"
        type: boolean
        default: false
      erzwingen:
        description: "Auswahl des Tages neu würfeln, auch wenn schon gelaufen"
        type: boolean
        default: false

permissions:
  contents: write           # GITHUB_TOKEN darf index.html zurück ins Repo pushen
  pages: write              # erlaubt das explizite Anstoßen des Pages-Builds (letzter Schritt)

concurrency:
  group: studien-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install --quiet "anthropic>=0.40" requests tzdata python-docx

      - name: Studienliste aktualisieren
        env:
          # Das Geheimnis heisst in diesem Repository KLIMAHUB. Fehlt es, bricht der
          # Lauf ab - bewusst ohne Rueckfallweg, damit ein falscher Name auffaellt.
          ANTHROPIC_API_KEY: ${{ secrets.KLIMAHUB }}
          MODEL: claude-haiku-4-5          # günstiges Modell; z. B. claude-sonnet-5 für mehr Qualität
          # SEARCH_TERM: '...'   # optional: Standardabfrage ueberschreiben (siehe update_studies.py)
        run: python scripts/update_studies.py ${{ inputs.erzwingen && '--erzwingen' || '' }}

      # Baut RSS-Feed (Mailchimp) und Download-Dateien aus dem Archiv.
      # Braucht weder API-Key noch Netz – liest nur studien-archiv.json.
      - name: Newsletter-Feed & Downloads erzeugen
        run: python scripts/build_newsletter.py

      # Legt bei Mailchimp einen ENTWURF an und schickt eine Testausgabe zur
      # Entwurf anlegen, pruefen, terminieren. Verschickt wird hier noch nichts:
      # Die Kampagne wird auf TERMIN_UTC gesetzt und laesst sich bis dahin in
      # Mailchimp absagen. Faellt der Torwaechter durch, bleibt der Entwurf
      # liegen. Ohne hinterlegten Schluessel passiert schlicht nichts; ein
      # Fehler hier darf das Studien-Update nicht scheitern lassen - und er
      # faellt in die sichere Richtung, weil dann eben nichts terminiert ist.
      - name: Newsletter-Entwurf anlegen, pruefen und terminieren
        continue-on-error: true
        env:
          # Das Geheimnis heisst in diesem Repository KLIMAHUBMC ("MC" fuer
          # Mailchimp - nicht mit KLIMAHUB verwechseln, das ist der
          # Claude-Schluessel).
          MAILCHIMP_API_KEY: ${{ secrets.KLIMAHUBMC }}
        if: ${{ !inputs.nur_studien }}
        run: python scripts/mailchimp_entwurf.py

      - name: Committen & pushen (nur bei Änderung)
        id: commit
        env:
          DATEIEN: index.html studien-archiv.json studien-feed.xml download versand-status.json
        run: |
          if [ -z "$(git status --porcelain $DATEIEN)" ]; then
            echo "Keine Änderung – nichts zu committen."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "Klima-Portal Bot"
          git config user.email "stegmaier@m-vf.de"
          git add $DATEIEN
          git commit -m "Studien-Update $(TZ=Europe/Berlin date +%d.%m.%Y)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes mit dem GITHUB_TOKEN lösen nicht zuverlässig einen Pages-Build aus.
      # Deshalb stoßen wir ihn explizit an; schlägt das fehl, ist der Lauf trotzdem OK
      # (der Build kommt dann über den normalen Push-Mechanismus).
      - name: GitHub-Pages-Build anstoßen
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
